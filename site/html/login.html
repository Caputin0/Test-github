<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" 
    href="style.css">
    <title>Doppio x</title>
 <a href="index.html" class="logo">
            Doppio <span>Mocha</span>
<body class="pagina-login">
      
        <nav class="logo-login">
           <img src="../imagens/logo.png" alt="Doppio Mocha" class="logo-login">
            <p>
         Conte com a sua melhor experiência de compra, com a gente você tem o melhor preço e a melhor qualidade. 
            </p>
        </nav>
        <form class="form-login">
            <h2>
                fazer login
            </h2>
            <p class="subtitulo">
                Entre na sua conta
            </p>
            <div class="campo">
                <label for="email">
                    E-mail
                </label>
                <input type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
                >
            </div>

            <div class="senha">
                <label for="senha">
                    Senha
                </label>
                <input type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
                >
            </div>

            <div class="esqueci senha">
                <a href="esqueci-senha.html">
                    Esqueci minha senha
                </a>
            </div>
            <button type="submit"
            class="botao-entrar">
        Entrar
        </button>
            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="cadastro.html">
                    Cadastre-se
                </a>
            </p>
            <a href="index.html" class="voltar">
                Voltar para a loja
            </a>
        </form>

        <footer class="footer-login">
            Melhor loja do Nordeste
        </footer>

        
    
</body>
</html>
